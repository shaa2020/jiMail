name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jimail/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm --filter @jimail/api test:unit
        env:
          APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://unused@localhost/unused
          APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          MAIL_HOSTNAME: mail.jimail.test
      - run: pnpm build
      - name: Dependency vulnerability scan
        run: pnpm audit --prod --audit-level high

  integration:
    name: Integration + end-to-end (live Stalwart)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: jimail, POSTGRES_PASSWORD: jimail_dev, POSTGRES_DB: jimail }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jimail" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://jimail:jimail_dev@127.0.0.1:5432/jimail
      REDIS_URL: redis://127.0.0.1:6379
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      COOKIE_SECURE: "false"
      STALWART_WEBHOOK_SECRET: ci-webhook-secret
      MAIL_HOSTNAME: mail.jimail.test
      MAIL_TRANSPORT: file
      MAIL_FILE_DIR: /tmp/jimail-outbox
      DNS_RESOLVERS: 127.0.0.1:5353
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jimail/api exec prisma migrate deploy
      - name: Start and bootstrap Stalwart
        run: ./scripts/dev-stalwart.sh >> stalwart.env && sed 's/^export //' stalwart.env >> "$GITHUB_ENV"
      - name: Integration tests (real Stalwart)
        run: pnpm --filter @jimail/api test:integration
      - name: Build
        run: pnpm --filter @jimail/api build && API_PROXY_TARGET=http://127.0.0.1:4000 pnpm --filter @jimail/web build
      - name: End-to-end browser tests
        run: |
          echo '{}' > /tmp/fakedns.json
          node apps/api/test/support/fake-dns.js 5353 /tmp/fakedns.json &
          (cd apps/api && node dist/main.js &) && (cd apps/web && API_PROXY_TARGET=http://127.0.0.1:4000 npx next start -p 3000 &)
          npx --yes wait-on@8 http://127.0.0.1:4000/api/v1/health http://127.0.0.1:3000
          cd apps/web && npx playwright install --with-deps chromium && npx playwright test --trace off
